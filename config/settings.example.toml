# Copy to config/settings.toml (git-ignored) and fill in your tokens.
#   cp config/settings.example.toml config/settings.toml && chmod 600 config/settings.toml
# Any value can be overridden by an environment variable (shown in comments) - handy for Docker/CI.
# Override the file location with MARKETFLOW_SETTINGS=/path/to/settings.toml

[database]
# SQLite for local use (relative paths are resolved from the project root; the file is created on first run).
# MySQL:  "mysql+pymysql://user:pass@127.0.0.1:3306/marketflow?charset=utf8mb4"      (env: DATABASE_URL)
url = "sqlite:///data/marketflow.db"

[auth]
# Signs login tokens. REQUIRED for the API; >= 32 chars. Generate:  python -c "import secrets; print(secrets.token_urlsafe(48))"
jwt_secret = ""        # env: JWT_SECRET
token_ttl_minutes = 60 # env: TOKEN_TTL_MINUTES

[server]
# HTTPS. Credentials and margin data cross this connection: use TLS anywhere beyond localhost.
# Either serve TLS here (both paths required) or terminate it at a reverse proxy and set hsts = true.
tls_cert = ""          # env: TLS_CERT  (PEM)
tls_key  = ""          # env: TLS_KEY   (PEM)
hsts = false           # env: HSTS
public_url = ""        # env: PUBLIC_URL. Dashboard address added to alerts as a link (alerts carry no cost or margin figures)
trust_proxy = ""       # env: TRUST_PROXY. Reverse proxy address(es), e.g. "127.0.0.1": makes login throttling use the real client IP

[approval]
# One person runs this (default): you may approve your own proposals, including ones below the margin defense line.
# Set false for a team: authors cannot approve their own proposals and below-defense-line changes need an ADMIN.
solo_mode = true       # env: SOLO_MODE

[alerts]
# Slack-compatible incoming webhook (https). Alerts carry margin data: point it at a channel only MD/ADMIN can read.
webhook_url = ""       # env: ALERT_WEBHOOK_URL

[llm]
mock = true            # env: MOCK_LLM. Set false to use Gemini for self-healing extraction.
gemini_api_key = ""    # env: GEMINI_API_KEY  (https://aistudio.google.com)
gemini_model = "gemini-2.5-flash"   # env: GEMINI_MODEL

[vision]              # image reading (competitor flyers, banners) through the OpenAI API (ChatGPT). Empty key = vision disabled.
openai_api_key = ""    # env: OPENAI_API_KEY  (https://platform.openai.com/api-keys). Keep this file chmod 600; never commit the key.
openai_model = "gpt-4o-mini"   # env: OPENAI_MODEL. Any vision-capable model your account can use.

[sources.kamis]        # https://www.kamis.or.kr -> open API key + id
api_key = ""           # env: KAMIS_API_KEY
api_id  = ""           # env: KAMIS_API_ID
product_cls = "02"     # "01" retail, "02" wholesale

[sources.garak]        # Garak market endpoint (see src/marketflow/collectors/garak.py)
url     = ""           # env: GARAK_API_URL
api_key = ""           # env: GARAK_API_KEY

# Pricing decision parameters (all optional; defaults shown). Per-category overrides: [decision.Fresh]
[decision]
# vat_rate = 0.10                  # KRW VAT
# target_min_margin_pct = 0        # price floor = lowest price achieving this net margin (0 = break-even)
# undercut_pct = 0                 # 0 = match lowest competitor; max 5
# max_step_pct = 10                # max price move per run
# cooldown_hours = 6
# wholesale_rise_threshold_pct = 5 # no price cuts while wholesale rose more than this
# round_to = 10                    # price tick (KRW)
# flash_discount_pct = 10          # spoilage-risk markdown
# alert_margin_pct = 10            # LOW_MARGIN flag at or below this net margin
# disposal_rate_pct = 0            # category average write-off, % of purchase cost; a per-SKU disposal_cost in the ERP file wins
# require_confirmed_match = true   # only competitor listings a person graded SAME (Matches) drive prices and alerts

[quality]              # daily data-quality thresholds; breaches raise DATA_QUALITY alerts (every key optional)
# min_success_rate = 0.95      # share of finished crawler runs (7 days) that succeeded
# max_unparseable = 20         # open titles whose quantity/unit could not be read
# max_unmapped = 50            # open titles / benchmark items that match nothing in the catalog
# max_unconfirmed = 100        # competitor listings waiting to be graded
# max_recheck = 10             # confirmed listings not seen for 7 days

[mi]                   # Market Intelligence (Category Health + Trend Radar); every key is optional
# min_periods = 4              # observations a keyword needs before it gets a lifecycle stage
# recent_periods = 2           # growth = last N periods vs the N before
# rising_threshold = 0.15      # keyword search growth that counts as rising
# health_threshold = 0.03      # category demand change below this = steady
# demand_metrics = ["gmv", "unitsold"]
# [mi.weights]                 # Trend Radar score weights (relative)
# search = 0.5
# product = 0.2
# promotion = 0.15
# media = 0.15

[crawlers]
# inbox_dir = "data/inbox"     # one subfolder per file crawler: report, buyer, flyer, newproduct (shared by worker and API)
