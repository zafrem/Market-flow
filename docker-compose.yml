# Full topology: db + collector-worker (scheduler) + backend-api (API + dashboard on :8000).
services:
  db:
    image: mysql:8.0
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_0900_ai_ci", "--default-time-zone=+00:00"]
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-marketflow}
      MYSQL_USER: ${MYSQL_USER:-marketflow}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - ./mysql_data:/var/lib/mysql
      - ./db/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:${MYSQL_PORT:-3306}:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30

  collector-worker:
    build:
      context: .
      dockerfile: docker/collector.Dockerfile
    environment:
      DATABASE_URL: mysql+pymysql://${MYSQL_USER:-marketflow}:${MYSQL_PASSWORD}@db:3306/${MYSQL_DATABASE:-marketflow}?charset=utf8mb4
      MOCK_LLM: ${MOCK_LLM:-true}
      KAMIS_API_KEY: ${KAMIS_API_KEY:-}
      KAMIS_API_ID: ${KAMIS_API_ID:-}
      GARAK_API_URL: ${GARAK_API_URL:-}
      GARAK_API_KEY: ${GARAK_API_KEY:-}
      ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}      # vision (flyer reading); empty = disabled
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      TZ: Asia/Seoul
    volumes:
      - ./config:/app/config   # edit rules / approved overrides without rebuilding
      - ./inbox:/app/data/inbox   # file-inbox crawlers (report, buyer, flyer, new product): shared with the API so dashboard uploads reach the same folders
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  backend-api:
    build:
      context: .
      dockerfile: docker/collector.Dockerfile      # same image as the worker, different command
    command: ["python", "-m", "marketflow.web", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      DATABASE_URL: mysql+pymysql://${MYSQL_USER:-marketflow}:${MYSQL_PASSWORD}@db:3306/${MYSQL_DATABASE:-marketflow}?charset=utf8mb4
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET (>= 32 chars) in .env}
      TOKEN_TTL_MINUTES: ${TOKEN_TTL_MINUTES:-60}
      TZ: Asia/Seoul
    volumes:
      - ./inbox:/app/data/inbox
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"          # localhost only; put a TLS reverse proxy in front for remote access
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
    restart: unless-stopped
